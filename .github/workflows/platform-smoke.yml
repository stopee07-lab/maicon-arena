name: OS installation and camera smoke test
on: [push, pull_request, workflow_dispatch]
jobs:
  simulator:
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux rendering libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1 libglib2.0-0
      - name: Install in the local virtual environment
        run: python launch.py --setup
      - name: Portable launcher tests
        run: python -m unittest discover -s tests -p test_portable_launch.py
      - name: Windows hosted runner software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted Windows has no vendor OpenGL driver. Scope Mesa to this job.
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'b2e00615feaba45942343c265cc8c5f576142ca682c1ac6661922d4b72492877') { throw 'Mesa download hash mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Get-ChildItem "$destination\x64\*.dll" | Copy-Item -Destination $env:pythonLocation -Force
          Get-ChildItem "$destination\x64\*.dll" | Copy-Item -Destination 'training\.venv\Scripts' -Force
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append
          'LIBGL_ALWAYS_SOFTWARE=1' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Import packages and render a MuJoCo camera
        if: runner.os != 'macOS'
        run: python launch.py --check
      - name: macOS packages (hosted ARM runner has no CGL pixel format)
        if: runner.os == 'macOS'
        run: python -c "import subprocess; from runtime_paths import runtime_python; from pathlib import Path; subprocess.run([str(runtime_python(Path.cwd())), '-c', 'import mujoco, torch, ultralytics'], check=True)"
      - name: Actual model, physics and match lifecycle
        if: runner.os != 'macOS'
        run: python platform_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-packages-${{ runner.os }}
          path: |
            runtime/installed-packages-*.txt
            runtime/platform-smoke-result.json
