name: OS installation and camera smoke test
on: [push, pull_request, workflow_dispatch]
jobs:
  simulator:
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux rendering libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1 libglib2.0-0
      - name: Install in the local virtual environment
        run: python launch.py --setup
      - name: Portable launcher tests
        run: python -m unittest discover -s tests -p test_portable_launch.py
      - name: Import packages and render a MuJoCo camera
        if: runner.os != 'macOS'
        run: python launch.py --check
      - name: macOS packages (hosted ARM runner has no CGL pixel format)
        if: runner.os == 'macOS'
        run: python -c "import subprocess; from runtime_paths import runtime_python; from pathlib import Path; subprocess.run([str(runtime_python(Path.cwd())), '-c', 'import mujoco, torch, ultralytics'], check=True)"
      - name: Actual model, physics and match lifecycle
        if: runner.os != 'macOS'
        run: python platform_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-packages-${{ runner.os }}
          path: |
            runtime/installed-packages-*.txt
            runtime/platform-smoke-result.json
