<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자리결정 연습</title><link rel="stylesheet" href="/workbench.css"><style>body{max-width:1000px;margin:auto;padding:28px;font-size:18px}.row{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}button{font:inherit;padding:14px;touch-action:none;background:#2d4540;border:1px solid #63877a;border-radius:8px;color:#effaf3;cursor:pointer}button:hover{background:#3d6055}img{width:100%;max-width:640px;background:#222}input{font:inherit;width:100px}#clock{font-size:36px}pre{white-space:pre-wrap}a{color:#a0e0bd}</style><a href="/">← 개발·경기 화면</a><h1>자리결정 서브게임</h1><p>레이더시설을 등지고 출발 → 180도 회전 → 약 3m 앞 수광부 2초 연속 타격. 첫 주행·팬틸트 명령부터 60초, 두 번 시도합니다. 실측 전 수광부 치수는 모의값입니다.</p><div class="row"><button id="new">새 연습 묶음 · 첫 시도</button><button id="next">두 번째 시도</button><button id="stop">시도 종료</button><a href="/?page=run">3D와 코드 실행 화면 →</a></div><strong id="clock">대기</strong><p id="status" role="status"></p><img id="camera" alt="B-1 카메라"><div class="row"><button data-w="1.4">↶ 좌회전</button><button data-v=".2">↑ 전진</button><button data-w="-1.4">↷ 우회전</button><button id="fire">레이저 발사</button></div><p>주행 버튼을 누르고 있는 동안만 움직입니다.</p><div class="row"><label>pan <input id="pan" type="number" min="-100" max="100" value="0"></label><label>tilt <input id="tilt" type="number" min="-100" max="100" value="11"></label><button id="gimbal">팬틸트 적용</button></div><pre id="results"></pre><script type="module" src="/subgame.js"></script></html>
